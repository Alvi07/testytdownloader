services:
  - type: web
    name: prostream-video-downloader
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      # Required for YouTube on Render (bot check). Set in Render Dashboard:
      # Environment → YOUTUBE_COOKIES_BASE64 = base64 of your cookies.txt
      # Do NOT commit cookies to git.
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
      # Optional residential/mobile proxy for YouTube downloads on Render:
      # http://user:pass@host:port  OR  socks5://user:pass@host:port
      # Free public proxies usually fail for YouTube.
      - key: YOUTUBE_PROXY
        sync: false
